name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  checks: read
  contents: write
  pull-requests: read

jobs:
  release:
    name: Publish extension
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'dev/v')
    runs-on: ubuntu-latest
    steps:
      - name: Require successful Check workflow
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          checks=$(gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json bucket,workflow)
          jq -e '[.[] | select(.workflow == "Check")] |
            length > 0 and all(.[]; .bucket == "pass")' <<< "$checks"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Validate tag and extension
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          [[ "$RELEASE_BRANCH" =~ ^dev/v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          [[ -x gh-release-flow ]]
          printf 'RELEASE_TAG=%s\n' "${RELEASE_BRANCH#dev/}" >> "$GITHUB_ENV"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          release_args=()
          [[ "$RELEASE_TAG" == *-* ]] && release_args+=(--prerelease)
          gh release create "$RELEASE_TAG" gh-release-flow --target "$MERGE_SHA" --generate-notes "${release_args[@]}"

