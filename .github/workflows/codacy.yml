# Runs Codacy's analyzers with Codacy CLI v2 and uploads the results to
# GitHub code scanning. The tools it runs are listed in .codacy/codacy.yaml.
#
# This replaces codacy/codacy-analysis-cli-action, which can no longer run on
# GitHub-hosted runners: its Docker client (API 1.39) is older than the runner
# daemon accepts, so every tool failed and the SARIF upload was rejected.
# CLI v2 runs the tools directly, without Docker.
#
# Update the CLI by changing both values below, taking the linux_amd64 digest
# from https://github.com/codacy/codacy-cli-v2/releases.

name: Codacy Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    env:
      CODACY_CLI_VERSION: 1.0.0-main.387.sha.28c6773
      CODACY_CLI_SHA256: dfa47dad87d48df7a5076c57e0c124861b9a63903469e87e9b7af7323799fcbd
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Codacy CLI
        run: |
          archive="codacy-cli-v2_${CODACY_CLI_VERSION}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/codacy/codacy-cli-v2/releases/download/${CODACY_CLI_VERSION}/${archive}"
          printf '%s  %s\n' "$CODACY_CLI_SHA256" "$archive" | sha256sum -c -
          mkdir codacy-cli
          tar -xzf "$archive" -C codacy-cli
          printf '%s\n' "$RUNNER_TEMP/codacy-cli" >> "$GITHUB_PATH"
      - name: Install analysis tools
        run: codacy-cli-v2 install
      - name: Run Codacy analysis
        run: codacy-cli-v2 analyze --format sarif --output "$RUNNER_TEMP/codacy.sarif"
      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/codacy.sarif
